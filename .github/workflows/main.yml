    name: Send JMeter results to Grafana Cloud
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_GRAPHITE_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          set -e

          echo "Sending JMeter results to Grafana Cloud..."

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          GRAFANA_URL = os.environ["GRAFANA_URL"]
          GRAFANA_TOKEN = os.environ["GRAFANA_TOKEN"]

          print("Reading results.jtl...")

          tree = ET.parse("results.jtl")
          root = tree.getroot()

          metrics = []
          sample_count = 0

          # Process all JMeter sample elements
          for sample in root.iter("sample"):

              timestamp = sample.attrib.get("ts")
              elapsed = sample.attrib.get("t", "0")
              label = sample.attrib.get("lb", "unknown")
              success = sample.attrib.get("s", "false")
              latency = sample.attrib.get("lt", "0")
              connect = sample.attrib.get("ct", "0")

              if not timestamp:
                  continue

              sample_count += 1

              timestamp_seconds = int(timestamp) // 1000

              safe_label = "".join(
                  c if c.isalnum() or c in ".-" else ""
                  for c in label
              )

              if not safe_label:
                  safe_label = "unknown"

              success_value = 1 if success == "true" else 0

              print(
                  f"Processing sample {sample_count}: "
                  f"{safe_label} | "
                  f"time={timestamp_seconds} | "
                  f"elapsed={elapsed}ms | "
                  f"success={success}"
              )

              metrics.append({
                  "name": f"jmeter.{safe_label}.response_time",
                  "interval": 1,
                  "value": float(elapsed),
                  "time": timestamp_seconds
              })

              metrics.append({
                  "name": f"jmeter.{safe_label}.success",
                  "interval": 1,
                  "value": success_value,
                  "time": timestamp_seconds
              })

              metrics.append({
                  "name": f"jmeter.{safe_label}.latency",
                  "interval": 1,
                  "value": float(latency),
                  "time": timestamp_seconds
              })

              metrics.append({
                  "name": f"jmeter.{safe_label}.connect_time",
                  "interval": 1,
                  "value": float(connect),
                  "time": timestamp_seconds
              )

          print("----------------------------------------")
          print(f"JMeter samples processed: {sample_count}")
          print(f"Grafana metrics prepared: {len(metrics)}")
          print("----------------------------------------")

          if sample_count == 0:
              print("ERROR: No JMeter samples found.")
              raise SystemExit(1)

          # Send in batches instead of one HTTP request per sample
          batch_size = 500
          total_sent = 0

          for i in range(0, len(metrics), batch_size):

              batch = metrics[i:i + batch_size]

              payload = json.dumps(batch).encode("utf-8")

              request = urllib.request.Request(
                  GRAFANA_URL,
                  data=payload,
                  method="POST"
              )

              request.add_header(
                  "Authorization",
                  f"Bearer 3609143:{GRAFANA_TOKEN}"
              )

              request.add_header(
                  "Content-Type",
                  "application/json"
              )

              print(
                  f"Sending metrics batch "
                  f"{(i // batch_size) + 1} "
                  f"({len(batch)} metrics)..."
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      status = response.status
                      response_body = response.read().decode()

                      print(
                          f"Grafana response: HTTP {status}"
                      )

                      if response_body:
                          print(response_body)

                      if status < 200 or status >= 300:
                          raise RuntimeError(
                              f"Grafana returned HTTP {status}"
                          )

              except urllib.error.HTTPError as e:
                  print(
                      f"Grafana HTTP error: "
                      f"{e.code} {e.reason}"
                  )
                  print(e.read().decode())
                  raise

              total_sent += len(batch)

          print("----------------------------------------")
          print(f"JMeter samples processed: {sample_count}")
          print(f"Grafana metrics sent:     {total_sent}")
          print("----------------------------------------")
          print("JMeter metrics sent to Grafana Cloud successfully.")

          PY
