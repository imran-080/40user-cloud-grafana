      # ==========================================================
      # 7. Build Graphite -> Grafana Cloud bridge
      # ==========================================================
      - name: Build live Grafana Graphite bridge
        run: |
          set -e

          echo "========================================"
          echo "Building Graphite -> Grafana bridge"
          echo "========================================"

          cat > GraphiteGrafanaBridge.java <<'JAVA'
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.nio.charset.StandardCharsets;
          import java.time.Duration;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class GraphiteGrafanaBridge {

              private static final int PORT = 2003;

              private static final int BATCH_SIZE = 100;

              private static final long FLUSH_INTERVAL_MS = 2000;

              private static final List<Metric> queue =
                  Collections.synchronizedList(
                      new ArrayList<>()
                  );

              private static final AtomicBoolean running =
                  new AtomicBoolean(true);

              private static HttpClient httpClient;

              private static String grafanaUrl;

              private static String grafanaToken;


              // ==================================================
              // Metric class
              // ==================================================

              static class Metric {

                  String name;

                  double value;

                  long time;


                  Metric(
                      String name,
                      double value,
                      long time
                  ) {

                      this.name = name;

                      this.value = value;

                      this.time = time;
                  }
              }


              // ==================================================
              // Main
              // ==================================================

              public static void main(String[] args)
                  throws Exception {

                  grafanaUrl =
                      System.getenv("GRAFANA_URL");

                  grafanaToken =
                      System.getenv("GRAFANA_TOKEN");


                  if (
                      grafanaUrl == null
                      || grafanaUrl.isBlank()
                  ) {

                      throw new RuntimeException(
                          "GRAFANA_URL environment variable is missing"
                      );
                  }


                  if (
                      grafanaToken == null
                      || grafanaToken.isBlank()
                  ) {

                      throw new RuntimeException(
                          "GRAFANA_TOKEN environment variable is missing"
                      );
                  }


                  // ==============================================
                  // HTTP client
                  // ==============================================

                  httpClient =
                      HttpClient.newBuilder()
                          .connectTimeout(
                              Duration.ofSeconds(10)
                          )
                          .build();


                  // ==============================================
                  // Background flush thread
                  // ==============================================

                  Thread sender =
                      new Thread(
                          GraphiteGrafanaBridge::flushLoop
                      );

                  sender.setDaemon(true);

                  sender.start();


                  // ==============================================
                  // Shutdown hook
                  // ==============================================

                  Runtime.getRuntime().addShutdownHook(
                      new Thread(() -> {

                          running.set(false);

                          try {

                              flush();

                          } catch (Exception e) {

                              System.err.println(
                                  "Final flush failed: "
                                      + e.getMessage()
                              );
                          }
                      })
                  );


                  // ==============================================
                  // Graphite TCP server
                  // ==============================================

                  try (
                      ServerSocket serverSocket =
                          new ServerSocket(
                              PORT,
                              50,
                              InetAddress.getByName(
                                  "127.0.0.1"
                              )
                          )
                  ) {

                      serverSocket.setReuseAddress(true);


                      System.out.println(
                          "========================================"
                      );

                      System.out.println(
                          "Graphite -> Grafana bridge started"
                      );

                      System.out.println(
                          "Listening on 127.0.0.1:"
                              + PORT
                      );

                      System.out.println(
                          "========================================"
                      );


                      while (running.get()) {

                          Socket socket =
                              serverSocket.accept();


                          Thread client =
                              new Thread(
                                  () ->
                                      handleClient(socket)
                              );

                          client.setDaemon(true);

                          client.start();
                      }
                  }
              }


              // ==================================================
              // Handle JMeter Graphite connection
              // ==================================================

              private static void handleClient(
                  Socket socket
              ) {

                  try (
                      Socket s = socket;

                      BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  s.getInputStream(),
                                  StandardCharsets.UTF_8
                              )
                          )
                  ) {

                      String line;


                      while (
                          running.get()
                          && (
                              line = reader.readLine()
                          ) != null
                      ) {

                          line = line.trim();


                          if (line.isEmpty()) {
                              continue;
                          }


                          parseMetric(line);
                      }


                  } catch (Exception e) {

                      if (running.get()) {

                          System.err.println(
                              "Graphite client error: "
                                  + e.getMessage()
                          );
                      }
                  }
              }


              // ==================================================
              // Parse Graphite line
              //
              // Expected:
              //
              // metric.name value timestamp
              //
              // Example:
              //
              // jmeter.test.a.avg 123.4 1790000000
              // ==================================================

              private static void parseMetric(
                  String line
              ) {

                  try {

                      String[] parts =
                          line.split("\\s+");


                      if (parts.length < 3) {

                          System.err.println(
                              "Invalid Graphite line: "
                                  + line
                          );

                          return;
                      }


                      String name =
                          parts[0];


                      double value =
                          Double.parseDouble(
                              parts[1]
                          );


                      long timestamp =
                          Long.parseLong(
                              parts[2]
                          );


                      Metric metric =
                          new Metric(
                              name,
                              value,
                              timestamp
                          );


                      boolean flushNow =
                          false;


                      synchronized (queue) {

                          queue.add(metric);


                          if (
                              queue.size()
                              >= BATCH_SIZE
                          ) {

                              flushNow = true;
                          }
                      }


                      if (flushNow) {

                          flush();
                      }


                  } catch (Exception e) {

                      System.err.println(
                          "Could not parse Graphite line: "
                              + line
                      );

                      System.err.println(
                          "Reason: "
                              + e.getMessage()
                      );
                  }
              }


              // ==================================================
              // Background flush loop
              // ==================================================

              private static void flushLoop() {

                  while (running.get()) {

                      try {

                          Thread.sleep(
                              FLUSH_INTERVAL_MS
                          );


                          flush();


                      } catch (
                          InterruptedException e
                      ) {

                          Thread.currentThread()
                              .interrupt();

                          break;


                      } catch (Exception e) {

                          System.err.println(
                              "Flush loop error: "
                                  + e.getMessage()
                          );
                      }
                  }
              }


              // ==================================================
              // Send batch to Grafana Cloud
              // ==================================================

              private static void flush()
                  throws Exception {


                  List<Metric> batch;


                  synchronized (queue) {

                      if (queue.isEmpty()) {
                          return;
                      }


                      batch =
                          new ArrayList<>(queue);


                      queue.clear();
                  }


                  // ==============================================
                  // Build JSON
                  // ==============================================

                  StringBuilder json =
                      new StringBuilder();


                  json.append("[");


                  for (
                      int i = 0;
                      i < batch.size();
                      i++
                  ) {

                      Metric metric =
                          batch.get(i);


                      if (i > 0) {
                          json.append(",");
                      }


                      json.append("{");


                      json.append(
                          "\"name\":\""
                      );


                      json.append(
                          escapeJson(
                              metric.name
                          )
                      );


                      json.append(
                          "\","
                      );


                      json.append(
                          "\"interval\":10,"
                      );


                      json.append(
                          "\"value\":"
                      );


                      json.append(
                          Double.toString(
                              metric.value
                          )
                      );


                      json.append(",");


                      json.append(
                          "\"time\":"
                      );


                      json.append(
                          Long.toString(
                              metric.time
                          )
                      );


                      json.append("}");
                  }


                  json.append("]");


                  // ==============================================
                  // Create HTTP request
                  // ==============================================

                  HttpRequest request =
                      HttpRequest.newBuilder()
                          .uri(
                              URI.create(
                                  grafanaUrl
                              )
                          )
                          .timeout(
                              Duration.ofSeconds(30)
                          )
                          .header(
                              "Authorization",
                              "Bearer 3609143:"
                                  + grafanaToken
                          )
                          .header(
                              "Content-Type",
                              "application/json"
                          )
                          .POST(
                              HttpRequest
                                  .BodyPublishers
                                  .ofString(
                                      json.toString()
                                  )
                          )
                          .build();


                  // ==============================================
                  // Send request
                  // ==============================================

                  try {

                      HttpResponse<String> response =
                          httpClient.send(
                              request,
                              HttpResponse
                                  .BodyHandlers
                                  .ofString()
                          );


                      int status =
                          response.statusCode();


                      if (
                          status < 200
                          || status >= 300
                      ) {

                          System.err.println(
                              "Grafana HTTP "
                                  + status
                                  + ": "
                                  + response.body()
                          );


                          // Put failed batch back
                          synchronized (queue) {

                              queue.addAll(batch);
                          }


                          return;
                      }


                      System.out.println(
                          "Grafana live metrics sent: "
                              + batch.size()
                              + " | HTTP "
                              + status
                      );


                  } catch (Exception e) {

                      System.err.println(
                          "Grafana send failed: "
                              + e.getMessage()
                      );


                      // Put failed batch back
                      synchronized (queue) {

                          queue.addAll(batch);
                      }
                  }
              }


              // ==================================================
              // Escape JSON strings
              // ==================================================

              private static String escapeJson(
                  String value
              ) {

                  return value
                      .replace(
                          "\\",
                          "\\\\"
                      )
                      .replace(
                          "\"",
                          "\\\""
                      );
              }
          }
          JAVA


          echo "Compiling bridge..."

          javac GraphiteGrafanaBridge.java


          echo "========================================"

          echo "Bridge compiled successfully."

          echo "========================================"

          echo "Checking generated class..."

          test -f GraphiteGrafanaBridge.class

          echo "GraphiteGrafanaBridge.class found."
