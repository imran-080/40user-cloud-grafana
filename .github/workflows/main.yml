name: JMeter Load Test

on:
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Setup Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. Download JMeter 5.6.3
      # ==========================================================
      - name: Download JMeter 5.6.3
        run: |
          set -e

          echo "Downloading Apache JMeter 5.6.3..."

          wget -q \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz

          echo "Extracting JMeter..."

          tar -xzf apache-jmeter-5.6.3.tgz

          echo "JMeter installed successfully."

          ./apache-jmeter-5.6.3/bin/jmeter --version

      # ==========================================================
      # 4. Install Plugins Manager
      # ==========================================================
      - name: Install JMeter Plugins Manager
        run: |
          set -e

          echo "Installing JMeter Plugins Manager..."

          wget -q \
            https://repo1.maven.org/maven2/kg/apc/cmdrunner/2.3/cmdrunner-2.3.jar \
            -O apache-jmeter-5.6.3/lib/cmdrunner-2.3.jar

          wget -q \
            https://jmeter-plugins.org/get/ \
            -O apache-jmeter-5.6.3/lib/ext/jmeter-plugins-manager.jar

          echo "Plugins Manager installed."

      # ==========================================================
      # 5. Install Ultimate Thread Group plugin
      # ==========================================================
      - name: Install Ultimate Thread Group plugin
        run: |
          set -e

          echo "Installing Ultimate Thread Group plugin..."

          apache-jmeter-5.6.3/bin/PluginsManagerCMD.sh install jpgc-casutg

          echo "Ultimate Thread Group plugin installed."

      # ==========================================================
      # 6. Run JMeter test
      # ==========================================================
      - name: Run JMeter 5.6.3
        run: |
          set -e

          echo "========================================"
          echo "Starting JMeter test"
          echo "========================================"

          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t "View Results Tree.jmx" \
            -l results.jtl \
            -e \
            -o jmeter-report

          echo "========================================"
          echo "JMeter test completed"
          echo "========================================"

          echo "Checking results.jtl..."

          ls -lh results.jtl

          echo "Checking JMeter HTML report..."

          ls -lh jmeter-report

      # ==========================================================
      # 7. Send JMeter results to Grafana Cloud
      # ==========================================================
      - name: Send JMeter results to Grafana Cloud
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_GRAPHITE_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "Sending JMeter results to Grafana Cloud"
          echo "========================================"

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          GRAFANA_URL = os.environ["GRAFANA_URL"]
          GRAFANA_TOKEN = os.environ["GRAFANA_TOKEN"]

          print("Reading results.jtl...")

          # ======================================================
          # Read JMeter XML result file
          # ======================================================

          try:
              tree = ET.parse("results.jtl")
              root = tree.getroot()

          except Exception as e:
              print(f"ERROR: Could not read results.jtl: {e}")
              raise SystemExit(1)

          metrics = []
          sample_count = 0

          # ======================================================
          # Process top-level JMeter samples
          # ======================================================

          for sample in root.findall("sample"):

              timestamp = sample.attrib.get("ts")
              elapsed = sample.attrib.get("t", "0")
              label = sample.attrib.get("lb", "unknown")
              success = sample.attrib.get("s", "false")
              latency = sample.attrib.get("lt", "0")
              connect = sample.attrib.get("ct", "0")

              if not timestamp:
                  continue

              sample_count += 1

              timestamp_seconds = int(timestamp) // 1000

              # --------------------------------------------------
              # Make sampler name safe for Graphite
              # --------------------------------------------------

              safe_label = "".join(
                  c if c.isalnum() or c in "_.-" else "_"
                  for c in label
              )

              if not safe_label:
                  safe_label = "unknown"

              success_value = (
                  1 if success.lower() == "true" else 0
              )

              print(
                  f"Processing sample {sample_count}: "
                  f"{safe_label} | "
                  f"timestamp={timestamp_seconds} | "
                  f"elapsed={elapsed}ms | "
                  f"success={success}"
              )

              # --------------------------------------------------
              # Response time
              # --------------------------------------------------

              metrics.append({
                  "name": f"jmeter.{safe_label}.response_time",
                  "interval": 1,
                  "value": float(elapsed or 0),
                  "time": timestamp_seconds
              })

              # --------------------------------------------------
              # Success
              # --------------------------------------------------

              metrics.append({
                  "name": f"jmeter.{safe_label}.success",
                  "interval": 1,
                  "value": success_value,
                  "time": timestamp_seconds
              })

              # --------------------------------------------------
              # Latency
              # --------------------------------------------------

              metrics.append({
                  "name": f"jmeter.{safe_label}.latency",
                  "interval": 1,
                  "value": float(latency or 0),
                  "time": timestamp_seconds
              })

              # --------------------------------------------------
              # Connection time
              # --------------------------------------------------

              metrics.append({
                  "name": f"jmeter.{safe_label}.connect_time",
                  "interval": 1,
                  "value": float(connect or 0),
                  "time": timestamp_seconds
              })

          # ======================================================
          # Validate extraction
          # ======================================================

          print("----------------------------------------")
          print(f"JMeter samples processed: {sample_count}")
          print(f"Grafana metrics prepared: {len(metrics)}")
          print("----------------------------------------")

          if sample_count == 0:
              print("ERROR: No JMeter samples were found.")
              print(
                  "The JTL file exists but no top-level "
                  "<sample> elements were found."
              )
              raise SystemExit(1)

          if len(metrics) == 0:
              print("ERROR: No Grafana metrics were generated.")
              raise SystemExit(1)

          # ======================================================
          # Send metrics in batches
          # ======================================================

          batch_size = 500
          total_sent = 0

          for start in range(0, len(metrics), batch_size):

              batch = metrics[start:start + batch_size]

              payload = json.dumps(batch).encode("utf-8")

              request = urllib.request.Request(
                  GRAFANA_URL,
                  data=payload,
                  method="POST"
              )

              # Grafana Cloud Graphite authentication
              request.add_header(
                  "Authorization",
                  f"Bearer 3609143:{GRAFANA_TOKEN}"
              )

              request.add_header(
                  "Content-Type",
                  "application/json"
              )

              batch_number = (start // batch_size) + 1

              print(
                  f"Sending Grafana batch {batch_number}: "
                  f"{len(batch)} metrics"
              )

              try:

                  with urllib.request.urlopen(request) as response:

                      status = response.status

                      response_body = (
                          response.read().decode()
                      )

                      print(
                          f"Grafana response: HTTP {status}"
                      )

                      if response_body:
                          print(
                              "Grafana response body: "
                              f"{response_body}"
                          )

                      if status < 200 or status >= 300:
                          raise RuntimeError(
                              f"Grafana returned HTTP {status}"
                          )

              except urllib.error.HTTPError as e:

                  print(
                      "ERROR: Grafana HTTP error "
                      f"{e.code} {e.reason}"
                  )

                  try:
                      print(e.read().decode())
                  except Exception:
                      pass

                  raise SystemExit(1)

              except Exception as e:

                  print(
                      f"ERROR sending metrics to Grafana: {e}"
                  )

                  raise SystemExit(1)

              total_sent += len(batch)

          # ======================================================
          # Final result
          # ======================================================

          print("========================================")
          print(
              f"JMeter samples processed: {sample_count}"
          )
          print(
              f"Grafana metrics sent:     {total_sent}"
          )
          print("========================================")

          print(
              "JMeter metrics sent to Grafana Cloud successfully."
          )

          PY

      # ==========================================================
      # 8. Upload JMeter results
      # ==========================================================
      - name: Upload JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: |
            results.jtl
            jmeter-report
